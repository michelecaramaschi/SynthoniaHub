version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: synthonia_db
    environment:
      POSTGRES_USER: synthonia
      POSTGRES_PASSWORD: synthonia_dev
      POSTGRES_DB: synthonia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthonia"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: synthonia_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
